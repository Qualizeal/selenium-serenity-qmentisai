serenity.project.name = BR_POC

# ============================================
# ENVIRONMENT SELECTION
# ============================================
# Set which environment to run tests against
# Options: dev, qa, staging, prod
# This will load the corresponding .env.<environment> file
test.environment = qa

# ============================================
# WEBDRIVER CONFIGURATION
# ============================================
# Browser driver configuration
webdriver.driver = chrome

# Base URL - defaults to QA environment
# Override via System property: -Dwebdriver.base.url=https://your-url.com
webdriver.base.url = https://app.fi360test.com/app/security/login

# Test credentials - defaults to QA environment  
# Override via System properties or use .env files for local development
webdriver.base.username = qzteam@test.com
webdriver.base.password = QZteam2025!

#webdriver.provided.type = com.serenity.driver.DriverManager
webdriver.autodownload = true
#webdriver.chrome.driver = drivers/chromedriver.exe

# ============================================
# TIMEOUT CONFIGURATION
# ============================================
webdriver.timeouts.implicitlywait = 20000
webdriver.wait.for.timeout = 80000
serenity.timeout = 60000
webdriver.timeouts.pageLoadTimeout = 100000

# ============================================
# SCREENSHOT AND REPORTING
# ============================================
serenity.take.screenshots = AFTER_EACH_STEP
serenity.full.page.screenshot.strategy = true
serenity.console.colors = true
serenity.logging = NORMAL

# ============================================
# BROWSER CONFIGURATION
# ============================================
headless.mode = false
chrome.switches = --disable-infobars
chrome.capabilities.acceptSslCerts = true
chrome.capabilities.handlesAlerts = true

# ============================================
# REPORT CUSTOM FIELDS
# ============================================
report.customfields.ApplicationVersion = 17.3.2.1
report.customfields.environment = ${test.environment}
report.customfields.user = Test User
report.customfields.order = ApplicationVersion,environment,user

# ============================================
# RETRY CONFIGURATION
# ============================================
serenity.restart.browser.each.scenario = false
serenity.batch.size = 1
serenity.batch.number = 1
